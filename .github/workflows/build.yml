name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unpack project
        run: |
          echo "" | base64 -d > p.zip
          mkdir proj
          unzip -q p.zip -d proj
      - name: Build
        run: cd proj && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          

